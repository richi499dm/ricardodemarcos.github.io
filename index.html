<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricardo de Marcos</title>
  <style>
    /* ============================================================
       CSS
       ============================================================ */
    :root {
      --border-color: #e5e5e5;
      --text-color: #000000;
      --text-light: #888;
      --background-color: #ffffff;
      --hover-bg-color: #e9e9e9;
      --cursor-size: 4px;
      --cursor-size-hover: 18px;
      --cursor-size-image: 10px;
      --cursor-opacity: 0.8;
      --cursor-color: #000000;
      --gap-entre-proyectos: 30vh;      /* Gap para horizontales */
      --gap-vertical: 70vh;            /* Gap para vertical (más grande) */
    }

    :root.modo-oscuro {
      --border-color: #3a3a3a;
      --text-color: #e0e0e0;
      --text-light: #777;
      --background-color: #0e0e0e;
      --hover-bg-color: #2a2a2a;
      --cursor-color: #e0e0e0;
    }

    @font-face {
      font-family: 'REX';
      src: url('./fonts/FOT-NewRodinProM.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    /* Cursor personalizado */
    * {
      cursor: none !important;
      box-sizing: border-box;
    }
    html, body, body *, body *:hover, body *:active, body *:focus,
    body *::before, body *::after {
      cursor: none !important;
    }

    #custom-cursor {
      position: fixed;
      width: var(--cursor-size);
      height: var(--cursor-size);
      background-color: var(--cursor-color);
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      transform: translate(-50%, -50%);
      transition: width 0.2s ease, height 0.2s ease, background-color 0.3s ease, opacity 0.2s ease;
      opacity: var(--cursor-opacity);
      left: -100px;
      top: -100px;
    }

    /* HEADER SUPERIOR IZQUIERDO: "RICARDO DE MARCOS"*/
    .header-left {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .jeep-back {
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.8em;
      padding: 0;
      margin: 0;
      background: none;
      border: none;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      cursor: none !important;
    }

    .jeep-back:hover {
      opacity: 0.7;
      transform: translateX(-2px);
    }

    .jeep-back:active {
      transform: translateX(0);
    }

    /* HEADER SUPERIOR DERECHO: BOTÓN DE TEMA "/B" */
    .theme-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }
    #theme-switcher-btn {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      font-size: 1em;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: none !important;
    }
    #theme-switcher-btn:hover {
      opacity: 0.6;
    }
    #theme-switcher-btn .icon-light,
    #theme-switcher-btn .icon-dark {
      display: none;
    }
    :root:not(.modo-oscuro) #theme-switcher-btn .icon-light {
      display: block;
    }
    :root.modo-oscuro #theme-switcher-btn .icon-dark {
      display: block;
    }

    /* FOOTER INFERIOR IZQUIERDO: "ABOUT" */
    .footer-left-fixed {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      font-size: 0.8em;
    }

    .footer-left-fixed a {
      color: var(--text-color);
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      cursor: none !important;
    }

    .footer-left-fixed a:hover {
      opacity: 0.7;
      transform: translateX(-2px);
    }

    .footer-left-fixed .footer-separator {
      color: var(--text-light);
      opacity: 0.3;
    }

    .footer-left-fixed .footer-copyright {
      color: var(--text-light);
      font-size: 0.75em;
      opacity: 0.6;
    }

    /*FOOTER INFERIOR DERECHO: "2026" */
    .footer-right-fixed {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      font-size: 0.9em;
      color: var(--text-light);
      letter-spacing: 0.5px;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .footer-right-fixed:hover {
      opacity: 1;
    }

    /* ============================================================
       ESTRUCTURA PRINCIPAL - CON GAP ENTRE PROYECTOS
       ============================================================ */
    
    .main-wrapper {
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      overflow-x: hidden;
      position: relative;
      scroll-behavior: smooth;
    }

    /* Página horizontal (estándar) */
    .page {
      width: 100%;
      height: calc(100vh + var(--gap-entre-proyectos));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Página vertical (más gap) */
    .page-vertical {
      height: calc(100vh + var(--gap-vertical)); /* ← Gap más grande */
    }

    /* ============================================================
       IMÁGENES HORIZONTALES (3:2)
       ============================================================ */
    
    .project-link {
      display: block;
      width: 100%;
      max-width: 800px;
      text-decoration: none;
      color: inherit;
      position: sticky;
      top: 50%;
      transform: translateY(-50%);
      cursor: none !important;
    }

    .fixed-image {
      width: 100%;
      aspect-ratio: 3 / 2;
      background-color: var(--hover-bg-color);
      border-radius: 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      transition: background-color 0.3s ease;
      border: 0px solid var(--border-color);
      overflow: hidden;
    }

    .fixed-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0px;
      display: block;
    }

    /* ============================================================
       IMÁGENES VERTICALES (2:3)
       ============================================================ */
    
    .project-link-vertical {
      display: block;
      width: 100%;
      max-width: 500px; /* Más estrecho para formato vertical */
      text-decoration: none;
      color: inherit;
      position: sticky;
      top: 50%;
      transform: translateY(-50%);
      cursor: none !important;
    }

    .fixed-image-vertical {
      width: 100%;
      aspect-ratio: 4 / 5; /* ← VERTICAL 2:3 */
      background-color: var(--hover-bg-color);
      border-radius: 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      transition: background-color 0.3s ease;
      border: 0px solid var(--border-color);
      overflow: hidden;
    }

    .fixed-image-vertical img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0px;
      display: block;
    }

    /* Ocultar scrollbar */
    .main-wrapper::-webkit-scrollbar {
      display: none;
    }
    .main-wrapper {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ============================================================
       CSS RESPONSIVE
       ============================================================ */
    @media (max-width: 700px) {
      :root {
        --gap-entre-proyectos: 20vh;
        --gap-vertical: 40vh; /* ← Gap vertical más pequeño en móvil */
        --cursor-size-image: 8px;
      }
      .header-left {
        top: 15px;
        left: 15px;
      }
      .theme-wrapper {
        top: 15px;
        right: 15px;
      }
      .footer-left-fixed {
        bottom: 15px;
        left: 15px;
        flex-wrap: wrap;
        gap: 0.8rem;
        font-size: 0.8em;
      }
      .footer-right-fixed {
        bottom: 15px;
        right: 15px;
        font-size: 0.8em;
      }
      .project-link {
        width: 90%;
        max-width: 600px;
      }
      .project-link-vertical {
        width: 70%;
        max-width: 400px;
      }
    }

    @media (max-width: 450px) {
      :root {
        --gap-entre-proyectos: 15vh;
        --gap-vertical: 30vh; /* ← Gap vertical aún más pequeño */
        --cursor-size-image: 6px;
      }
      .project-link {
        width: 95%;
        max-width: 400px;
      }
      .project-link-vertical {
        width: 80%;
        max-width: 300px;
      }
    }

    /* Reset body */
    body {
      font-family: 'REX', sans-serif;
      margin: 0;
      background-color: var(--background-color);
      color: var(--text-color);
      font-size: 0.9em;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- CURSOR PERSONALIZADO -->
  <div id="custom-cursor"></div>

  <!-- HEADER SUPERIOR IZQUIERDO -->
  <div class="header-left">
    <a href="index.html" class="jeep-back">RICARDO DE MARCOS</a>
  </div>

  <!-- HEADER SUPERIOR DERECHO -->
  <div class="theme-wrapper">
    <button id="theme-switcher-btn">
      <span class="icon-light">/B</span>
      <span class="icon-dark">/W</span>
    </button>
  </div>

  <!-- FOOTER INFERIOR IZQUIERDO -->
  <div class="footer-left-fixed">
    <a href="texto.html">ABOUT</a>
  </div>

  <!-- FOOTER INFERIOR DERECHO -->
  <div class="footer-right-fixed">© 2026 All rights reserved.</div>

  <!-- CONTENEDOR PRINCIPAL DE SCROLL -->
  <div class="main-wrapper" id="main-wrapper">

    <!-- PÁGINA 1 - HORIZONTAL -->
    <div class="page">
      <a href="proyecto1.html" class="project-link">
        <div class="fixed-image">
          <img src="IMAGES/01/img11.webp" alt="Proyecto 1">
        </div>
      </a>
    </div>

    <!-- PÁGINA 2 - HORIZONTAL -->
    <div class="page">
      <a href="proyecto2.html" class="project-link">
        <div class="fixed-image">
          <img src="IMAGES/02/img01.webp" alt="Proyecto 2">
        </div>
      </a>
    </div>

 <!-- PÁGINA 4 - VERTICAL CON MÁS GAP -->
    <div class="page page-vertical">
      <a href="proyecto4.html" class="project-link-vertical">
        <div class="fixed-image-vertical">
          <img src="IMAGES/04/img02.webp" alt="Proyecto 4">
        </div>
      </a>
      </div>


    <!-- PÁGINA 3 - HORIZONTAL -->
    <div class="page">
      <a href="proyecto3.html" class="project-link">
        <div class="fixed-image">
          <img src="IMAGES/03/img01.webp" alt="Proyecto 3">
        </div>
      </a>
    </div>

   

      <!-- PÁGINA 4 - VERTICAL CON MÁS GAP -->
    <div class="page page-vertical">
      <a href="proyecto5.html" class="project-link-vertical">
        <div class="fixed-image-vertical">
          <img src="IMAGES/05/img01.webp" alt="Proyecto 5">
        </div>
      </a>
    </div>

  </div>

  <!-- JAVASCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('📄 Scroll de proyectos cargado');

      // 1. CURSOR
      const cursor = document.getElementById('custom-cursor');
      if (cursor) {
        document.addEventListener('mousemove', function(e) {
          cursor.style.left = e.clientX + 'px';
          cursor.style.top = e.clientY + 'px';
          cursor.style.opacity = 'var(--cursor-opacity)';
        });

        // Elementos normales (botones, links de texto)
        const hoverElements = document.querySelectorAll('a:not(.project-link):not(.project-link-vertical), button, .jeep-back, .footer-left-fixed a');

        // Elementos de imagen (cursor más pequeño)
        const imageHoverElements = document.querySelectorAll('.project-link, .project-link-vertical');

        // Event listeners para elementos normales
        hoverElements.forEach(function(el) {
          el.addEventListener('mouseenter', function() {
            cursor.style.width = 'var(--cursor-size-hover)';
            cursor.style.height = 'var(--cursor-size-hover)';
            cursor.style.backgroundColor = document.documentElement.classList.contains('modo-oscuro') ? '#ffffff' : '#000000';
          });
          el.addEventListener('mouseleave', function() {
            cursor.style.width = 'var(--cursor-size)';
            cursor.style.height = 'var(--cursor-size)';
            cursor.style.backgroundColor = 'var(--cursor-color)';
          });
        });

        // Event listeners para imágenes (cursor más pequeño)
        imageHoverElements.forEach(function(el) {
          el.addEventListener('mouseenter', function() {
            cursor.style.width = 'var(--cursor-size-image)';
            cursor.style.height = 'var(--cursor-size-image)';
            cursor.style.backgroundColor = document.documentElement.classList.contains('modo-oscuro') ? '#ffffff' : '#000000';
          });
          el.addEventListener('mouseleave', function() {
            cursor.style.width = 'var(--cursor-size)';
            cursor.style.height = 'var(--cursor-size)';
            cursor.style.backgroundColor = 'var(--cursor-color)';
          });
        });

        document.addEventListener('mousedown', function() {
          cursor.style.transform = 'translate(-50%, -50%) scale(0.7)';
        });
        document.addEventListener('mouseup', function() {
          cursor.style.transform = 'translate(-50%, -50%) scale(1)';
        });

        document.addEventListener('mouseleave', function() {
          cursor.style.opacity = '0';
        });
        document.addEventListener('mouseenter', function() {
          cursor.style.opacity = 'var(--cursor-opacity)';
        });
      }

      // 2. TEMA CLARO/OSCURO
      const themeBtn = document.getElementById('theme-switcher-btn');
      if (themeBtn) {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('modo-oscuro');
        }

        themeBtn.addEventListener('click', function() {
          const isDarkMode = document.documentElement.classList.toggle('modo-oscuro');
          localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
          if (cursor) {
            cursor.style.backgroundColor = 'var(--cursor-color)';
          }
        });
      }

      // 3. SONIDOS
      let sonidosActivados = true;
      let ultimoSonido = 0;

      const sonidoClick = new Audio('sounds/sound1.wav');
      const sonidoBoton = new Audio('sounds/sound1.wav');
      const sonidoScroll = new Audio('sounds/sound1.wav');

      sonidoClick.volume = 0.3;
      sonidoBoton.volume = 0.3;
      sonidoScroll.volume = 0.3;

      function reproducirSonido(audio, delay = 100) {
        if (!sonidosActivados) return;
        const ahora = Date.now();
        if (ahora - ultimoSonido < delay) return;
        ultimoSonido = ahora;
        try {
          audio.currentTime = 0;
          audio.play();
        } catch (error) {
          console.log('Error al reproducir sonido:', error);
        }
      }

      document.addEventListener('click', function(e) {
        if (e.target.closest('#custom-cursor')) return;
        const esBoton = e.target.closest('button, a, .jeep-back, .theme-wrapper button, .footer-left-fixed a, .project-link, .project-link-vertical');
        if (esBoton) {
          reproducirSonido(sonidoBoton, 150);
        } else {
          reproducirSonido(sonidoClick, 100);
        }
      });

      // 4. SONIDO AL SCROLL - ARREGLADO
      let ultimoScroll = 0;
      const mainWrapper = document.getElementById('main-wrapper');
      
      if (mainWrapper) {
        mainWrapper.addEventListener('scroll', function() {
          const scrollActual = mainWrapper.scrollTop;
          if (Math.abs(scrollActual - ultimoScroll) > 50) {
            reproducirSonido(sonidoScroll, 200);
            ultimoScroll = scrollActual;
          }
        });
      }

    });
  </script>

</body>
</html>
